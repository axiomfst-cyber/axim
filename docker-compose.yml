version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: axiom_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axiom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axiom_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-axiom_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axiom_user} -d ${POSTGRES_DB:-axiom_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axiom_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-axiom_user}:${POSTGRES_PASSWORD:-axiom_secret_password}@db:5432/${POSTGRES_DB:-axiom_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-axiom_user}:${POSTGRES_PASSWORD:-axiom_secret_password}@db:5432/${POSTGRES_DB:-axiom_db}
      SECRET_KEY: ${SECRET_KEY:-axiom_super_secret_jwt_key_development_only}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: axiom_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
